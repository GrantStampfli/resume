name: Deploy resume (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - apps/resume-gen/**
      - .github/workflows/deploy-resume.yml
  workflow_dispatch:
  # Sent by the admin when it saves the resume to the content database, where there is no
  # commit to trigger the push build.
  repository_dispatch:
    types: [resume-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/resume-gen
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, libxml
          tools: composer:v2
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: composer install --no-interaction --no-progress --prefer-dist --no-dev --working-dir=app

      # Only the generator and its workspace dependencies; the build reads the resume from the
      # content database when one is configured.
      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @stampfli/resume-gen...

      - name: Build HTML + PDF
        env:
          RESUME_CHROMIUM_PATH: /usr/bin/google-chrome
          CONTENT_DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/resume-gen/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
